name: Plugin registry
on:
  pull_request:
    paths:
      - plugins.json
      - scripts/plugins.js
      - src/utils/parser/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'UCProjects/UnderScript'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Check plugins.json
      id: check
      continue-on-error: true
      run: npm run plugins -- "--report=$RUNNER_TEMP/report/report.md"
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Remember the pull request
      if: github.event_name == 'pull_request'
      run: |
        mkdir -p "$RUNNER_TEMP/report"
        echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/report/number"
    - name: Save the report
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: plugin-report
        path: ${{ runner.temp }}/report
    - name: Fail when the check failed
      if: steps.check.outcome == 'failure'
      run: exit 1
