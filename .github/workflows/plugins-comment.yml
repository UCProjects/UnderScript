name: Plugin registry comment
on:
  workflow_run:
    workflows: [Plugin registry]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.repository == 'UCProjects/UnderScript' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Download the report
      uses: actions/download-artifact@v4
      with:
        name: plugin-report
        path: report
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
    - name: Comment the result
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('node:fs');
          const marker = '<!-- plugin-registry-check -->';
          const issue_number = Number(fs.readFileSync('report/number', 'utf8').trim());
          if (!Number.isSafeInteger(issue_number) || issue_number < 1) throw new Error('Invalid pull request number');
          const body = fs.readFileSync('report/report.md', 'utf8').slice(0, 20000);
          if (!body.startsWith(marker)) throw new Error('Unexpected report');
          const { owner, repo } = context.repo;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker));
          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
